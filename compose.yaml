# Deployment configuration (ADR 0001 & ADR 0009 personal polling mode; hardened container runtime).
#
# Periodic retention cleanup via host cron or systemd timer:
#   docker compose exec -T bot crypto-chatbot purge-expired
# Logical PostgreSQL backup:
#   docker compose exec -T bot crypto-chatbot backup-db /tmp/backup.dump

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_chatbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto_chatbot} -d ${POSTGRES_DB:-crypto_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
