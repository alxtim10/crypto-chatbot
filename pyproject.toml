[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-chatbot"
version = "0.1.0"
description = "Telegram research and education chatbot for crypto markets with deterministic analysis and Gemini narration."
readme = "PROJECT_PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "google-genai>=3.6,<4",
    "ccxt>=4.5,<5",
    "pandas>=3.1,<4",
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
    "mypy>=2.4",
    "pandas-stubs>=3.1",
]

[project.scripts]
crypto-chatbot = "crypto_chatbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_chatbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: requires network access; opt-in via `pytest -m live`"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
