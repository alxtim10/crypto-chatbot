# Alert Worker Configuration — Active Strategy: scalp_v1 (SCALP-SPEC-v1)
# Swing MTF flow (4h/1h -> 15m -> 5m) is kept in code and disabled by config.
# Switch `strategy: swing_mtf` to re-enable legacy swing MTF.
strategy: scalp_v1

universe_file: config/universe_scalp.txt
cadence_minutes: 5

# Legacy swing MTF timeframes (kept for swing_mtf mode, inactive under scalp_v1)
timeframes:
  bias: [4h, 1h]
  setup: 15m
  confirm: 5m

cooldown_hours:
  15m: 2
  1h: 6
  4h: 12
  1d: 24

max_alerts_per_run: 3
setup_expiry_minutes: 90
dead_man_hours: 1
dead_man_minutes: 15
quiet_hours_wib: "23:00-06:00"

scalp:
  phase: shadow
  universe_path: config/universe_scalp.txt
  trend_adx_min: 25.0
  range_adx_max: 20.0
  zone_max_atr_5m: 1.5
  ema20_zone_atr_15m: 0.15
  rejection_min_body_atr_5m: 0.5
  sl_buffer_atr_5m: 0.25
  tp1_r: 1.0
  tp1_close_frac: 0.6
  tp2_max_r: 2.0
  max_hold_bars_5m: 18
  range_min_cost_mult: 6.0
  range_min_atr_1h_mult: 1.5
  range_tp2_edge_frac: 0.8
  min_r_bps: 20.0
  max_r_bps: 80.0
  min_net_rr_tp2: 1.3
  entry_valid_bars_5m: 3
  human_delay_sec: 90
  costs:
    vip_tier: vip0
    maker_fee_bps: 2.0
    taker_fee_bps: 5.0
    order_notional_usd: 200.0
    fallback_spread_bps: 1.0
    fallback_taker_slippage_bps: 1.5
    max_cost_pct_of_r: 0.15
  filters:
    funding_window_minutes: 10
    macro_pre_minutes: 15
    macro_post_minutes: 30
    liq_cascade_block_bars: 3
    crowded_funding_abs_8h: 0.0005
    news_burst_window_minutes: 30
    daily_stop_r: -3.0
    loss_cooldown_minutes: 30
    max_open_taken_trades: 2
    event_calendar_path: config/event_calendar.yaml
